name: CI Pipeline for Task Management System

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  # Job для проверки базового качества кода
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate structure
      run: |
        echo "Проверяем базовую структуру проекта..."
        [ -d "frontend" ] && echo "✓ Папка frontend существует" || echo "✗ Нет папки frontend"
        [ -d "backend" ] && echo "✓ Папка backend существует" || echo "✗ Нет папки backend"
        [ -f "README.md" ] && echo "✓ README.md существует" || echo "✗ Нет README.md"

  # Job для проверки фронтенда (React)
  frontend-checks:
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Check if frontend package.json exists
      id: check_frontend
      run: |
        if [ -f "frontend/package.json" ]; then
          echo "frontend_exists=true" >> $GITHUB_OUTPUT
        else
          echo "frontend_exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ package.json для фронтенда не найден, пропускаем проверки"
        fi
        
    - name: Install and build frontend (if exists)
      if: steps.check_frontend.outputs.frontend_exists == 'true'
      run: |
        cd frontend
        npm ci
        npm run build --if-present
        
    - name: Run frontend tests (if exist)
      if: steps.check_frontend.outputs.frontend_exists == 'true'
      run: |
        cd frontend
        npm test -- --passWithNoTests --watchAll=false

  # Job для проверки бэкенд сервисов
  backend-checks:
    runs-on: ubuntu-latest
    needs: validate
    
    strategy:
      matrix:
        service: [api-gateway, auth-service, tasks-service, notification-service]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check service ${{ matrix.service }}
      run: |
        echo "Проверяем сервис ${{ matrix.service }}"
        if [ -d "backend/${{ matrix.service }}" ]; then
          echo "✓ Сервис ${{ matrix.service }} существует"
          ls -la backend/${{ matrix.service }}/
        else
          echo "⚠️ Сервис ${{ matrix.service }} еще не создан"
        fi